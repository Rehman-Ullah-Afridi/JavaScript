<!DOCTYPE html>
<html>

  <head>
    <title>2nd Challenge</title>
  </head>

  <body>
    <button onclick="
      console.log(`Cart Quantity: ${cartQuantity}`);
      ">Show Quantity</button>

    <button onclick="
    cartQuantity ++;
    if(cartQuantity >= 10) {
      alert('The Cart is full.')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
    ">Add to Cart</button>

    <button onclick="
    cartQuantity += 2;

    if(cartQuantity >= 10) {
      alert('The Cart is full.')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
    ">+2</button>

    <button onclick="
    cartQuantity += 3;

    if(cartQuantity >= 10) {
      alert('The Cart is full.')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
    ">+3</button>

    <button onclick="
    cartQuantity += 4;
    if(cartQuantity >= 10) {
      alert('The Cart is full.')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
    ">+4</button>

    <button onclick="
    cartQuantity += 5;
    if(cartQuantity >= 10) {
      alert('The Cart is full.')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
   
    ">+5</button>

    <button onclick="
    cartQuantity --;
    if(cartQuantity < 0) {
      alert('Not enough items in the cart!')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
    ">Remove from Cart</button>

    <button onclick="
    cartQuantity -= 2;
    if(cartQuantity < 0) {
      alert('Not enough items in the cart!')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
   
    ">-2</button>

    <button onclick="
    cartQuantity -= 3;
    if(cartQuantity < 0) {
      alert('Not enough items in the cart!')
    } else {
      console.log(`Cart Quantity: ${cartQuantity}`);
    }
    ">-3</button>

    <button onclick="
    console.log('Cart was Reset.');
    cartQuantity = 0;
    console.log(`Cart Quantity: ${cartQuantity}`);
    ">Reset</button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>

</html>
