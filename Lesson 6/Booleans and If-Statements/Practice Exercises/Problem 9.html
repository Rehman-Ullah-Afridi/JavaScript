<!DOCTYPE html>
<html>
<head>
  <title>9th Problem</title>
</head>
<body>
  <script>

    const randomNumber = Math.random();
    let result = '';
    
    if(randomNumber <= 0.5) {
      result = 'heads';
    } else {
      result = 'tails';
    }

    let guess = prompt('Guess heads or tails');

    if(result === guess) {
      console.log(`You Chose ${guess} Computer Chose ${result}. You Win`);
    } else {
      console.log(`You Chose ${guess} Computer Chose ${result}. You Lost.`);
    }
    
  </script>
</body>
</html>
