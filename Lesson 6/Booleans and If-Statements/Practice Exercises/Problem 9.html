<body>
  <script>

    const randomNumber = Math.random();
    let result = '';
    

    if(randomNumber <= 0.5) {
      result = 'heads';
    } else {
      result = 'tails';
    }

    let guess = 'tails';

    if(result === guess) {
      console.log('You Win.');
    } else {
      console.log('You Lost.');
    }
    
  </script>
