<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="Calculator.css">
  <title>1st Challenge</title>
</head>

<body>
  <div>
    <h1>
      My First Basic Calculator
    </h1>
    <p>
      <button onclick="
        calculation += '7';
        console.log(calculation);
        " class="math-button">7</button>
      <button onclick="
        calculation += '8';
        console.log(calculation);
        " class="math-button">8</button>
      <button onclick="
        calculation += '9';
        console.log(calculation);
        " class="math-button">9</button>

      <button onclick="
        calculation += ' / ';
        console.log(calculation);
        " class="math-button">/</button>
    </p>

    <p>
      <button onclick="
      calculation += '4';
      console.log(calculation);
      " class="math-button">4</button>
      <button onclick="
      calculation += '5';
      console.log(calculation);
      " class="math-button">5</button>
      <button onclick="
      calculation += '6';
      console.log(calculation);
      " class="math-button">6</button>

      <button onclick="
      calculation += '*';
      console.log(calculation);
      " class="math-button">*</button>
    </p>

    <p>
      <button onclick="
      calculation += '1';
      console.log(calculation);
      " class="math-button">1</button>
      <button onclick="
      calculation += '2';
      console.log(calculation);
      " class="math-button">2</button>
      <button onclick="
      calculation += '3';

      " class="math-button">3</button>

      " class="math-button">0</button>

      calculation += '.';
      console.log(calculation);
      " class="math-button">.</button>

      <button onclick="
      calculation = eval(calculation);
      console.log(calculation);
      " class="math-button">=</button>

      <button onclick="
      calculation += ' + ';
      console.log(calculation);
      " class="math-button">+</button>
    </p>

  </div>

    let calculation = '';
  </script>

</html>
