<!DOCTYPE html>
<html>
<head>
  <title>7th Problem</title>
</head>
<body>
  <script>
    function convertLength(length, from, to){
      if(from === 'miles'){
        const result = length * 1.6;
        return `${result} km`;
      } else if(to === 'km'){
        const result = length / 1.6;
        return `${result} miles`;
      }
    }
    console.log(convertLength(50,'miles','km'));
  </script>
</body>
</html>
